# Baut die Web-App (PWA) und veröffentlicht sie auf GitHub Pages:
# https://<besitzer>.github.io/TimeTracker/
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Web-Export
        run: npx expo export --platform web
        env:
          CI: '1'
          EXPO_PUBLIC_APP_VERSION: ${{ github.sha }}
      # Versionsdatei für die automatische Update-Prüfung der App
      - run: echo "{\"version\":\"${{ github.sha }}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
      # Direktaufrufe von Unterseiten (z.B. /TimeTracker/job/123) auf die App umleiten
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
